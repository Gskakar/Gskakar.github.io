<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>

  <div class="interactive-bg" aria-hidden="true">
    <span class="bg-blob blob-a"></span>
    <span class="bg-blob blob-b"></span>
    <span class="bg-grid"></span>
  </div>

  <header class="site-header">
    <nav class="nav">
      <div class="nav-brand">
        <a href="{{ '/' | relative_url }}" class="brand-link">
          Gurkeerat Singh Kakar
        </a>
      </div>
      <div class="nav-links">
        <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ '/projects/' | relative_url }}" class="{% if page.url contains '/projects' %}active{% endif %}">Projects</a>
        <a href="{{ '/experience/' | relative_url }}" class="{% if page.url contains '/experience' %}active{% endif %}">Experience</a>
        <a href="{{ '/awards/' | relative_url }}" class="{% if page.url contains '/awards' %}active{% endif %}">Achievements</a>
        <a href="{{ '/about/' | relative_url }}" class="{% if page.url contains '/about' %}active{% endif %}">About</a>
        <a href="{{ '/contact/' | relative_url }}" class="{% if page.url contains '/contact' %}active{% endif %}">Contact</a>
      </div>
    </nav>
  </header>

  <main id="main-content" class="container">
    {{ content }}
  </main>

  {% include footer.html %}
</body>
</html>
