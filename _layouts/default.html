<!DOCTYPE html>
<html lang="en">
<head>
  {% include head.html %}
  {%- if page.dashboard or page.dashboards %}
  <script src="{{ '/assets/js/vendor/chart.umd.min.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/dashboards.js' | relative_url }}" defer></script>
  {%- endif %}
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  {% include header.html %}

  <main id="main" class="wrap">
    {{ content }}
  </main>

  {% include footer.html %}

  <div class="lightbox" hidden role="dialog" aria-modal="true" aria-label="Image preview">
    <button class="lightbox-close" type="button" aria-label="Close">Close</button>
    <figure>
      <img alt="">
      <figcaption></figcaption>
    </figure>
  </div>
</body>
</html>
