{%- assign profile = site.data.profile -%}
<header class="site-header">
  <div class="wrap header-inner">
    <a href="{{ '/' | relative_url }}" class="site-name">{{ profile.name }}</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav class="site-nav" id="site-nav" aria-label="Main">
      <a href="{{ '/projects/' | relative_url }}" {% if page.url contains '/projects' %}aria-current="page"{% endif %}>Projects</a>
      <a href="{{ '/dashboards/' | relative_url }}" {% if page.url contains '/dashboards' %}aria-current="page"{% endif %}>Dashboards</a>
      <a href="{{ '/experience/' | relative_url }}" {% if page.url contains '/experience' %}aria-current="page"{% endif %}>Experience</a>
      <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about' or page.url contains '/awards' %}aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact' %}aria-current="page"{% endif %}>Contact</a>
      <a class="nav-resume" href="{{ profile.resume | relative_url }}" target="_blank" rel="noopener">Résumé</a>
    </nav>
  </div>
</header>
